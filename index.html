<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAMAR POCKET RADIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .radio-unit {
            background: #2c2c2c;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 2px solid #444;
        }

        .branding {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            color: #888;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .lcd-container {
            background: #000;
            padding: 8px;
            border-radius: 8px;
            border: 6px solid #111;
            margin-bottom: 20px;
        }

        .lcd-screen {
            background: #5a8fb3; 
            color: #000000;
            height: 170px;
            border-radius: 3px;
            padding: 10px;
            position: relative; /* Penting untuk overlay */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            transition: background 0.3s ease;
        }

        /* PERBAIKAN: Volume Overlay Menutup Seluruh LCD */
        #volumeOverlay {
            position: absolute;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: inherit; /* Mengikuti warna tombol Lamp */
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100; /* Di atas segalanya */
        }

        .lcd-header {
            display: flex;
            justify-content: space-between;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
        }

        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }

        .bar {
            width: 5px;
            background-color: #000;
            opacity: 0.1;
            height: var(--h);
            border-radius: 1px;
        }

        .bar.active { opacity: 1; }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .vol-bar-bg {
            width: 70%;
            height: 18px;
            border: 2px solid #000;
            margin-top: 10px;
            position: relative;
        }

        #vol-bar-fill {
            height: 100%;
            background: #000;
            width: 50%;
        }

        .channel-info {
            text-align: center;
            color: #000;
        }

        #channelName {
            font-family: 'Roboto', sans-serif;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
        }

        #statusDisplay { font-size: 10px; font-family: 'Roboto Mono'; margin-top: 5px; font-weight: bold;}

        /* TICKER SYSTEM */
        .tickers-area {
            border-top: 2px solid rgba(0,0,0,0.2);
            padding-top: 6px;
            margin-top: 5px;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
        }

        .quake-container {
            background: #000;
            border-radius: 3px;
            padding: 2px 0;
            overflow: hidden;
            display: flex;
        }

        .quake-mover {
            display: inline-flex;
            animation: scroll-seamless 10s linear infinite;
        }

        .quake-item {
            color: #5a8fb3;
            padding-right: 100px;
            text-transform: uppercase;
        }

        .news-mover {
            display: inline-flex;
            animation: scroll-seamless 40s linear infinite;
        }

        .news-item {
            color: #000;
            padding-right: 80px;
        }

        @keyframes scroll-seamless {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* CONTROLS */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(#4a4a4a, #2b2b2b);
            border: 1px solid #111;
            color: #fff;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #000;
            text-transform: uppercase;
            font-size: 12px;
        }

        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
        
        .btn-fav-toggle {
            background: linear-gradient(#634a4a, #3d2b2b);
        }
        .is-favourited {
            color: #ffeb3b;
            border-color: #ffeb3b;
        }

        .playlist-box {
            background: #111;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            border: 2px solid #222;
        }

        .playlist-item {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
            font-size: 13px;
            color: #888;
            text-align: left;
            width: 100%;
            background: none;
            border: none;
            display: flex;
            justify-content: space-between;
        }

        .playlist-item.active { 
            color: #fff; 
            border-left: 5px solid #fff;
            background: #1a1a1a;
            font-weight: bold;
        }
        
        .fav-star { color: #ffeb3b; margin-left: 5px; }

        /* Penempatan Posisi Kolom Grid Tombol Baru */
        .btn-nav-back { grid-column: 1; }
        .btn-nav-next { grid-column: 2; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        audio { display: none; }

        #cookieBanner {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
            z-index: 1000;
            display: none;
            font-size: 12px;
            border-top: 2px solid #5a8fb3;
        }
    </style>
</head>

</div>

    let currentIndex = 0;

    const player = document.getElementById("radioPlayer");
    const source = document.getElementById("audioSource");
    const screen = document.getElementById("virtualScreen");

    function initStorage() {
        if (!localStorage.getItem('cookieConsent')) {
            document.getElementById('cookieBanner').style.display = 'block';
        } else {
            loadFavorites();
        }
    }

    function acceptCookies() {
        localStorage.setItem('cookieConsent', 'true');
        document.getElementById('cookieBanner').style.display = 'none';
        loadFavorites();
    }

    function loadFavorites() {
        const saved = localStorage.getItem('radioFavs');
        if (saved) {
            favorites = JSON.parse(saved);
            buildPlaylist();
        }
    }

    function saveFavorites() {
        localStorage.setItem('radioFavs', JSON.stringify(favorites));
    }

    function toggleFavorite() {
        const chName = radioChannels[currentIndex].name;
        const favIdx = favorites.indexOf(chName);
        if (favIdx > -1) favorites.splice(favIdx, 1);
        else favorites.push(chName);
        saveFavorites();
        buildPlaylist();
        updateFavButton();
    }

    function updateFavButton() {
        const btn = document.getElementById('favToggleBtn');
        const chName = radioChannels[currentIndex].name;
        if (favorites.includes(chName)) {
            btn.classList.add('is-favourited');
            btn.innerText = "★ FAV";
        } else {
            btn.classList.remove('is-favourited');
            btn.innerText = "FAV";
        }
    }

    function buildPlaylist() {
        const list = document.getElementById('playlist');
        list.innerHTML = '';
        radioChannels.forEach((ch, i) => {
            const item = document.createElement('button');
            item.className = 'playlist-item';
            item.id = `item-${i}`;
            const isFav = favorites.includes(ch.name);
            item.innerHTML = `<span>${ch.name} ${isFav ? '<span class="fav-star">★</span>' : ''}</span> 
                             <small style='opacity:0.4'>${(i+1).toString().padStart(2,'0')}</small>`;
            item.onclick = () => loadChannel(i);
            list.appendChild(item);
        });
        const activeItem = document.getElementById(`item-${currentIndex}`);
        if(activeItem) activeItem.classList.add('active');
        
        // Memastikan scrollbar pada playlist box otomatis mengikuti channel aktif
        if(activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function loadChannel(index) {
        currentIndex = index;
        const ch = radioChannels[index];
        document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.getElementById(`item-${index}`);
        if(activeItem) activeItem.classList.add('active');
        if(activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        
        document.getElementById('channelName').textContent = "TUNING...";
        source.src = ch.url;
        player.load();
        player.play().then(() => { 
            document.getElementById('channelName').textContent = ch.name; 
        })
        .catch(() => { 
            document.getElementById('channelName').textContent = "NO SIGNAL"; 
        });
        updateFavButton();
    }

    // FUNGSI BARU: Pindah ke channel reguler sebelumnya (BACK)
    function prevChannel() {
        let newIndex = currentIndex - 1;
        if (newIndex < 0) {
            newIndex = radioChannels.length - 1;
        }
        loadChannel(newIndex);
    }

    // FUNGSI BARU: Pindah ke channel reguler berikutnya (NEXT)
    function nextChannel() {
        let newIndex = (currentIndex + 1) % radioChannels.length;
        loadChannel(newIndex);
    }

    function nextFav() {
        if (favorites.length === 0) return;
        for (let i = 1; i <= radioChannels.length; i++) {
            let checkIdx = (currentIndex + i) % radioChannels.length;
            if (favorites.includes(radioChannels[checkIdx].name)) {
                loadChannel(checkIdx);
                break;
            }
        }
    }

    function prevFav() {
        if (favorites.length === 0) return;
        for (let i = 1; i <= radioChannels.length; i++) {
            let checkIdx = (currentIndex - i + radioChannels.length) % radioChannels.length;
            if (favorites.includes(radioChannels[checkIdx].name)) {
                loadChannel(checkIdx);
                break;
            }
        }
    }

    function toggleLamp() {
        currentColorIndex = (currentColorIndex + 1) % colors.length;
        screen.style.backgroundColor = colors[currentColorIndex];
        // Overlay juga harus mengikuti warna agar transisinya halus
        document.getElementById('volumeOverlay').style.backgroundColor = colors[currentColorIndex];
    }

    function fetchEarthquake() {
        fetch('https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json')
        .then(r => r.json()).then(data => {
            const g = data.Infogempa.gempa;
            const txt = `[ INFO GEMPA TERKINI: MAGNITUDE ${g.Magnitude} - LOKASI: ${g.Wilayah} - WAKTU: ${g.Jam} ]`;
            document.getElementById('quakeContent').textContent = txt;
            document.getElementById('quakeContent2').textContent = txt;
        });
    }

    function fetchNews() {
        fetch('https://rss2json.com/api.json?rss_url=https://news.google.com/rss?hl=id&gl=ID&ceid=ID:id')
        .then(r => r.json()).then(data => {
            const news = data.items.map(i => i.title.toUpperCase()).join(' ••• ');
            document.getElementById('newsContent').textContent = news + ' ••• ';
            document.getElementById('newsContent2').textContent = news + ' ••• ';
        });
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('timeDisplay').textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} WIB`;
    }

    function adjustVol(v) { 
        player.volume = Math.max(0, Math.min(1, player.volume + v)); 
        const overlay = document.getElementById('volumeOverlay');
        const volFill = document.getElementById('vol-bar-fill');
        const volPercent = document.getElementById('volPercent');
        
        overlay.style.display = 'flex';
        const percentage = Math.round(player.volume * 100);
        volFill.style.width = percentage + '%';
        volPercent.textContent = percentage + '%';
        
        clearTimeout(volumeTimeout);
        volumeTimeout = setTimeout(() => { overlay.style.display = 'none'; }, 1500);
    }

    function updateBufferBars() {
        const bars = document.querySelectorAll('.bar');
        if (player.buffered.length > 0) {
            const buffer = player.buffered.end(player.buffered.length - 1) - player.currentTime;
            document.getElementById('statusDisplay').textContent = `BUFFER: ${buffer.toFixed(1)}s`;
            bars.forEach((b, i) => b.classList.toggle('active', i < Math.ceil(buffer/2)));
        }
    }

    initStorage();
    buildPlaylist();
    updateClock();
    fetchNews();
    fetchEarthquake();
    setInterval(updateClock, 1000);
    setInterval(updateBufferBars, 500);
    setInterval(fetchNews, 300000);
    setInterval(fetchEarthquake, 60000);
    setTimeout(() => loadChannel(0), 1000);
</script>
</body>
</html>
